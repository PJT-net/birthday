<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            overflow: hidden;
            background: #0a0a23;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft Yahei", sans-serif;
            color: #fff;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
        .content {
            z-index: 2;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            color: #ffd700;
            text-shadow: 0 0 15px #ff8800;
            margin-bottom: 20px;
        }
        .text-box {
            font-size: clamp(1rem, 3vw, 1.6rem);
            line-height: 1.8;
            min-height: 80px;
            color: #ffeaa7;
        }
        #clickTip {
            margin-top: 30px;
            font-size: 18px;
            color: #ffaaaa;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%,100%{opacity:1}
            50%{opacity:0.2}
        }
        .cake {
            font-size: 80px;
            margin-bottom:20px;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="content">
    <div class="cake">🎂</div>
    <h1>生日快乐</h1>
    <div class="text-box" id="msg"></div>
    <div id="clickTip">点击屏幕，释放更多烟花✨</div>
</div>

<script>
    // 打字机文字，你可以改呢段祝福语
    const words = "愿新一岁，平安喜乐，万事顺意，所愿皆所得，日日有星光。";
    const msgDom = document.getElementById('msg');
    let idx = 0;
    function type() {
        if(idx < words.length){
            msgDom.innerText += words[idx];
            idx++;
            setTimeout(type,100);
        }
    }
    type();

    // 烟花 Canvas
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
        constructor(x,y,color){
            this.x = x;
            this.y = y;
            this.sx = (Math.random()-0.5)*8;
            this.sy = (Math.random()-0.5)*8;
            this.alpha = 1;
            this.color = color;
            this.decay = 0.008 + Math.random()*0.01;
        }
        update(){
            this.x += this.sx;
            this.y += this.sy;
            this.sy += 0.12;
            this.alpha -= this.decay;
        }
        draw(){
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x,this.y,2,0,Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }
    let particles = [];
    const colors = ['#ffd700','#ff5555','#55ffff','#ff77dd','#77ff77'];

    function firework(x,y){
        const c = colors[Math.floor(Math.random()*colors.length)];
        for(let i=0;i<120;i++){
            particles.push(new Particle(x,y,c));
        }
    }

    // 自动烟花
    setInterval(()=>{
        firework(Math.random()*canvas.width, Math.random()*canvas.height*0.6);
    }, 1800);

    // 点击触发烟花
    window.addEventListener('click',e=>{
        firework(e.clientX,e.clientY);
    })

    function render(){
        ctx.fillStyle = 'rgba(10,10,35,0.15)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        for(let i=particles.length-1;i>=0;i--){
            const p = particles[i];
            p.update();
            p.draw();
            if(p.alpha <= 0) particles.splice(i,1);
        }
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
